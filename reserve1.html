<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reserve1.css">
    <!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="global.css">
</head>
<body>
    <div id="navbar"></div>

<section class="reserve-section">

    <div class="reserve-container">

        <!-- Left Side -->

        <div class="reserve-image">

            <img src="images/reserve img.jpg" alt="Wine Bottle">

            <div class="wine-badge">
                <i class="fa-solid fa-wine-glass"></i>
                Premium Collection
            </div>

        </div>

        <!-- Right Side -->

        <div class="reserve-content">

            <span class="sub-title">
                Reserve Exclusive Wine
            </span>

            <h2>
                Reserve This Bottle
            </h2>

            <p>
                Experience our hand-selected collection of premium wines.
                Reserve your favorite bottle in advance and enjoy an unforgettable
                tasting experience in our elegant wine bar.
            </p>

            <form>

                <div class="input-box">

                    <input type="text"
                    placeholder="Your Name"
                    required>

                    <input type="email"
                    placeholder="Email Address"
                    required>

                </div>

                <div class="input-box">

                    <input type="date"
                    required>

                    <input type="time"
                    required>

                </div>

                <div class="input-box">

                    <select>

                        <option>Select Bottle</option>

                        <option>Cabernet Sauvignon</option>

                        <option>Merlot Reserve</option>

                        <option>Pinot Noir</option>

                        <option>Chardonnay</option>

                        <option>Rosé Premium</option>

                    </select>

                    <select>

                        <option>Guests</option>

                        <option>2 Guests</option>

                        <option>4 Guests</option>

                        <option>6 Guests</option>

                        <option>8 Guests</option>

                    </select>

                </div>

                <textarea
                placeholder="Special Request"></textarea>

                <button>

                    Reserve Bottle

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>

        </div>

    </div>

</section>
 <div id="footer"></div>
 <script src="component.js"></script>

</body>
</html>
